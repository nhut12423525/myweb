  <style>
    .form-box {
      width: 450px;
      margin: 40px auto;
      padding: 20px;
      box-shadow: 0 0 10px gray;
      background-color: white;
      border-radius: 10px;
    }
    .form-box h2 {
      text-align: center;
      color: brown;
      margin-bottom: 20px;
    }
    .form-box input {
      width: 100%;
      height: 35px;
      margin-bottom: 15px;
      padding: 5px 10px;
      border: 1px solid gray;
      border-radius: 5px;
    }
    .form-box .nut {
      width: 100%;
      height: 40px;
      background-color: yellowgreen;
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
    .form-box .nut:hover {
      background-color: brown;
      color: yellow;
    }
    .form-box p {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

  <div class="container">

      <form>
        <label>Họ và tên:</label><br>
        <input type="text" placeholder="Nhập họ và tên"><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Nhập email"><br>

        <label>Số điện thoại:</label><br>
        <input type="tel" placeholder="Nhập số điện thoại"><br>

        <label>Mật khẩu:</label><br>
        <input type="password" placeholder="Nhập mật khẩu"><br>

        <label>Nhập lại mật khẩu:</label><br>
        <input type="password" placeholder="Nhập lại mật khẩu"><br>
